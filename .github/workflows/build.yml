name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test tests/TraceMind.Tests -c Release
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Publish TraceMind.exe
        run: dotnet publish src/TraceMind.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true ${{ env.VERSION_ARG }} -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TraceMind-win-x64
          path: publish/TraceMind.exe
      - name: Publish a GitHub Release when the version changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/TraceMind.App/TraceMind.App.csproj)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - skipping"
          else
            gh release create "v$VERSION" publish/TraceMind.exe --title "TraceMind $VERSION" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          fi
